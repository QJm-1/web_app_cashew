<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ project_name }}</title>

<!-- All styles and fonts load from the local static folder, so the panel works offline -->
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/lato/lato.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/adminlte/adminlte.min.css') }}">

<style>
  /* ---------- kiosk tweaks on top of AdminLTE ---------- */
  html, body { height: 100%; }
  body, h1, h2, h3, h4, h5, h6, .btn, .badge, .navbar-brand, .modal-title {
    font-family: "Lato", "DejaVu Sans", Arial, sans-serif;
  }
  body {
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .content-wrapper { padding-top: .75rem; min-height: calc(100vh - 57px) !important; }
  .navbar-brand { font-weight: 700; }
  #clock { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 1.15rem; }
  #statusBadge { font-size: .85rem; font-weight: 600; padding: .45em .7em; }

  .small-box { margin-bottom: .75rem; transition: opacity .3s; }
  .small-box .inner h3 { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .small-box .inner h3 sup { font-size: 45%; top: -.9em; font-weight: 400; }
  .small-box .inner p { margin-bottom: .4rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .small-box .small-box-footer { cursor: default; font-weight: 600; }
  .dim .small-box { opacity: .45; }

  /* thin bar inside each box */
  .meter {
    position: relative; height: 10px; border-radius: 5px;
    background: rgba(255,255,255,.3); overflow: hidden;
  }
  .meter .fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    background: #fff; transition: width .6s ease;
  }
  .meter .band {
    position: absolute; top: 0; bottom: 0;
    background: repeating-linear-gradient(45deg, rgba(0,0,0,.25) 0 3px, transparent 3px 6px);
  }

  /* pH indicator strip */
  .ph-strip {
    position: relative; height: 12px; border-radius: 6px;
    background: linear-gradient(90deg,
      #D7262B 0%, #F28B1E 21%, #F2D21E 36%, #3FA34D 50%,
      #1E8F8F 64%, #2756A8 79%, #5B2C83 100%);
    box-shadow: 0 0 0 2px rgba(255,255,255,.6);
  }
  .ph-strip .marker {
    position: absolute; top: -5px; bottom: -5px; width: 5px; margin-left: -2.5px;
    background: #fff; border-radius: 3px; box-shadow: 0 0 0 2px #343a40;
    transition: left .6s ease;
  }

  /* relay buttons */
  .relay-btn {
    width: 100%; height: 100%; min-height: 120px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 700; font-size: 1rem;
    border-width: 2px;
    touch-action: manipulation;
  }
  .relay-btn i { font-size: 1.6rem; margin-bottom: .35rem; }
  .relay-btn .rstate { font-size: .85rem; font-weight: 600; opacity: .85; }
  .relay-btn.pending { opacity: .55; }
  .relay-grid {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: .75rem; padding-bottom: .75rem;
  }
  .relay-btn .rname { line-height: 1.15; text-align: center; }
  .relay-btn.timed-on { background: #17a2b8; border-color: #17a2b8; color: #fff; }
  @media (max-width: 600px) { .relay-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .card-tools .btn { font-weight: 700; }

  /* short screens like 800x480 */
  @media (max-height: 520px) {
    .small-box .inner { padding: 8px 10px; }
    .small-box .inner h3 { font-size: 1.9rem; margin-bottom: .2rem; }
    .small-box .inner p { font-size: .9rem; }
    .small-box .icon > i { font-size: 52px; top: 14px; }
    .relay-btn { min-height: 92px; }
    .content-wrapper { padding-top: .5rem; }
  }

  /* power button + popup */
  .power-btn { width: 44px; height: 44px; border-radius: 50%; padding: 0; font-size: 1.15rem; }
  #powerModal { display: none; }
  #powerModal.show { display: block; }
  .power-choice {
    display: flex; align-items: center; gap: .9rem;
    width: 100%; padding: .9rem 1rem; margin-bottom: .6rem;
    font-size: 1.05rem; font-weight: 700; text-align: left;
  }
  .power-choice i { font-size: 1.5rem; width: 1.8rem; text-align: center; }
  .power-choice small { display: block; font-weight: 400; opacity: .85; }
  #powerMsg { display: none; text-align: center; padding: 1rem 0; }
  #powerMsg i { font-size: 2.2rem; margin-bottom: .75rem; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<body class="hold-transition layout-top-nav">
<div class="wrapper">

  <!-- Navbar -->
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <div class="container-fluid">
      <span class="navbar-brand"><i class="fas fa-seedling text-success mr-2"></i>{{ project_name }}</span>
      <ul class="navbar-nav ml-auto align-items-center">
        <li class="nav-item mr-3">
          <span class="badge badge-secondary" id="statusBadge">Starting</span>
        </li>
        <li class="nav-item mr-3"><span id="clock">--:--</span></li>
        <li class="nav-item">
          <button class="btn btn-danger power-btn" id="powerBtn" aria-label="Exit or shut down">
            <i class="fas fa-power-off"></i>
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Content -->
  <div class="content-wrapper">
    <div class="content">
      <div class="container-fluid" id="readings">

        <!-- Readings -->
        <div class="row">
          <!-- pH -->
          <div class="col-6 col-md-3">
            <div class="small-box bg-info">
              <div class="inner">
                <h3 id="phValue">--</h3>
                <p>pH level</p>
                <div class="ph-strip"><div class="marker" id="phMarker" style="left:50%;display:none"></div></div>
              </div>
              <div class="icon"><i class="fas fa-vial"></i></div>
              <span class="small-box-footer" id="phHint">&nbsp;</span>
            </div>
          </div>

          <!-- Moisture -->
          <div class="col-6 col-md-3">
            <div class="small-box bg-primary">
              <div class="inner">
                <h3><span id="moistValue">--</span><sup>%</sup></h3>
                <p>Soil moisture</p>
                <div class="meter"><div class="fill" id="moistFill"></div><div class="band" id="moistBand"></div></div>
              </div>
              <div class="icon"><i class="fas fa-tint"></i></div>
              <span class="small-box-footer" id="moistHint">&nbsp;</span>
            </div>
          </div>

          <!-- Temp 1 -->
          <div class="col-6 col-md-3">
            <div class="small-box bg-danger">
              <div class="inner">
                <h3><span id="t1Value">--</span><sup>°C</sup></h3>
                <p>PTC temperature</p>
                <div class="meter"><div class="fill" id="t1Fill"></div><div class="band tband"></div></div>
              </div>
              <div class="icon"><i class="fas fa-thermometer-half"></i></div>
              <span class="small-box-footer" id="t1Hint">&nbsp;</span>
            </div>
          </div>

          <!-- Temp 2 -->
          <div class="col-6 col-md-3">
            <div class="small-box bg-maroon">
              <div class="inner">
                <h3><span id="t2Value">--</span><sup>°C</sup></h3>
                <p>Container temperature</p>
                <div class="meter"><div class="fill" id="t2Fill"></div><div class="band tband"></div></div>
              </div>
              <div class="icon"><i class="fas fa-thermometer-half"></i></div>
              <span class="small-box-footer" id="t2Hint">&nbsp;</span>
            </div>
          </div>
        </div>

        <!-- Relays -->
        <div class="card card-outline card-primary">
          <div class="card-header">
            <h3 class="card-title"><i class="fas fa-plug mr-2"></i>Relays</h3>
            <div class="card-tools">
              <button class="btn btn-success btn-sm mr-1" id="allOn" title="Mixer, Heater and Extractor"><i class="fas fa-power-off mr-1"></i>All on</button>
              <button class="btn btn-secondary btn-sm" id="allOff"><i class="fas fa-power-off mr-1"></i>All off</button>
            </div>
          </div>
          <div class="card-body pb-0">
            <div class="relay-grid" id="relayGrid"></div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<!-- Exit / shut down popup -->
<div class="modal fade" id="powerModal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="powerTitle">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="powerTitle"><i class="fas fa-power-off text-danger mr-2"></i>Exit or shut down</h5>
        <button type="button" class="close" id="powerClose" aria-label="Close"><span aria-hidden="true">&times;</span></button>
      </div>
      <div class="modal-body">
        <div id="powerChoices">
          <p class="text-muted mb-3">All relays will be switched off first.</p>
          <button class="btn btn-warning power-choice" id="exitBtn">
            <i class="fas fa-sign-out-alt"></i>
            <span>Exit app<small>Close the panel and return to the desktop</small></span>
          </button>
          <button class="btn btn-danger power-choice" id="shutdownBtn">
            <i class="fas fa-power-off"></i>
            <span>Shut down Raspberry Pi<small>Turn off the Pi safely</small></span>
          </button>
        </div>
        <div id="powerMsg">
          <i class="fas fa-spinner fa-spin d-block" id="powerMsgIcon"></i>
          <p class="mb-0" id="powerMsgText"></p>
        </div>
      </div>
      <div class="modal-footer" id="powerFooter">
        <button class="btn btn-secondary btn-lg" id="powerCancel">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script>
  const CFG = {{ cfg | tojson }};
  const $ = id => document.getElementById(id);

  // ---------- static setup ----------
  const mb = $("moistBand");
  mb.style.left  = CFG.moist_low + "%";
  mb.style.width = (CFG.moist_high - CFG.moist_low) + "%";

  document.querySelectorAll(".tband").forEach(b => {
    b.style.left  = (CFG.temp_low / CFG.temp_max * 100) + "%";
    b.style.width = ((CFG.temp_high - CFG.temp_low) / CFG.temp_max * 100) + "%";
  });

  const relayGrid = $("relayGrid");
  const relayBtns = CFG.relays.map(r => {
    const b = document.createElement("button");
    b.className = "btn btn-outline-secondary relay-btn";
    b.innerHTML = `<i class="fas ${r.icon}"></i><span class="rname"></span><span class="rstate"></span>`;
    b.querySelector(".rname").textContent = r.name;
    b.addEventListener("click", () => toggleRelay(r.ch));
    relayGrid.appendChild(b);
    return b;
  });

  // ---------- state ----------
  let relayState = [false, false, false, false, false, false];
  let pulseLeft = {};
  const pending = {};
  let connected = false;

  const fmt = (v, d) => (v === null || v === undefined) ? "--" : v.toFixed(d);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function hint(id, icon, text) {
    $(id).innerHTML = `<i class="fas ${icon} mr-1"></i>`;
    $(id).appendChild(document.createTextNode(text));
  }

  function renderPh(ph) {
    $("phValue").textContent = fmt(ph, 2);
    const m = $("phMarker");
    if (ph === null) { m.style.display = "none"; hint("phHint", "fa-exclamation-triangle", "No reading"); return; }
    m.style.display = "block";
    m.style.left = (clamp(ph, 0, 14) / 14 * 100) + "%";
    if (ph < 6.5)      hint("phHint", "fa-arrow-down", "Acidic");
    else if (ph > 7.5) hint("phHint", "fa-arrow-up", "Alkaline");
    else               hint("phHint", "fa-check-circle", "Neutral");
  }

  function renderMoist(v) {
    $("moistValue").textContent = fmt(v, 1);
    $("moistFill").style.width = (v === null ? 0 : clamp(v, 0, 100)) + "%";
    if (v === null)                hint("moistHint", "fa-exclamation-triangle", "No reading");
    else if (v < CFG.moist_low)    hint("moistHint", "fa-exclamation-triangle", "Dry");
    else if (v > CFG.moist_high)   hint("moistHint", "fa-exclamation-triangle", "Wet");
    else                           hint("moistHint", "fa-check-circle", "Good");
  }

  function renderTemp(v, valId, fillId, hintId) {
    $(valId).textContent = fmt(v, 1);$(fillId).style.width = (v === null ? 0 : clamp(v / CFG.temp_max * 100, 0, 100)) + "%";
    if (v === null)              hint(hintId, "fa-exclamation-triangle", "No reading");
    else if (v < CFG.temp_low)   hint(hintId, "fa-arrow-down", `Below ${CFG.temp_low}°C`);
    else if (v > CFG.temp_high)  hint(hintId, "fa-exclamation-triangle", `Above ${CFG.temp_high}°C`);
    else                         hint(hintId, "fa-check-circle", "In range");
  }

  function renderRelays() {
    const now = Date.now();
    CFG.relays.forEach((r, i) => {
      const b = relayBtns[i];
      const ch = r.ch;
      const p = pending[ch];
      if (p && (relayState[ch - 1] === p.want || now > p.until)) delete pending[ch];
      const on = relayState[ch - 1];
      const timed = r.pulse > 0;
      b.classList.toggle("btn-success", on && !timed);
      b.classList.toggle("timed-on", on && timed);
      b.classList.toggle("btn-outline-secondary", !on);
      b.classList.toggle("pending", !!pending[ch]);

      let state;
      if (timed) {
        const left = pulseLeft[String(ch)];
        state = on ? (left !== undefined ? `On, ${Math.ceil(left)} s left` : "On")
                   : `Off, runs ${r.pulse} s`;
      } else {
        state = on ? "On" : "Off";
      }
      b.querySelector(".rstate").textContent = state;
      b.setAttribute("aria-pressed", on);
      b.disabled = !connected;
    });
    $("allOn").disabled = $("allOff").disabled = !connected;
  }

  function renderStatus(s) {
    const badge = $("statusBadge");
    let cls, msg;
    if (!s.connected) {
      cls = "badge-danger"; msg = "ESP32 not found. Check the USB cable.";
    } else if (s.age === null) {
      cls = "badge-warning"; msg = `Connected on ${s.port}, waiting for readings`;
    } else if (s.age > CFG.stale_after) {
      cls = "badge-warning"; msg = `No readings for ${Math.round(s.age)} s`;
    } else {
      cls = "badge-success"; msg = `Connected on ${s.port}`;
    }
    badge.className = "badge " + cls;
    badge.textContent = msg;
    $("readings").classList.toggle("dim", cls !== "badge-success");
  }

  // ---------- polling ----------
  async function poll() {
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      const s = await r.json();
      connected = s.connected;
      relayState = s.relays;
      pulseLeft = s.pulse_left || {};
      renderStatus(s);
      renderPh(s.ph);
      renderMoist(s.moist);
      renderTemp(s.t1, "t1Value", "t1Fill", "t1Hint");
      renderTemp(s.t2, "t2Value", "t2Fill", "t2Hint");
      renderRelays();
    } catch (e) {
      connected = false;
      $("statusBadge").className = "badge badge-danger";
      $("statusBadge").textContent = "Panel server not responding. Restart app.py.";
      $("readings").classList.add("dim");
      renderRelays();
    }
  }

  async function sendRelay(ch, on) {
    try {
      await fetch("/api/relay", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ch, on })
      });
    } catch (e) { /* next poll shows the real state */ }
  }

  function toggleRelay(ch) {
    const want = !relayState[ch - 1];
    pending[ch] = { want, until: Date.now() + 3000 };
    renderRelays();
    sendRelay(ch, want);
  }

  function allRelays(on) {
    CFG.relays.forEach(r => {
      if (on && r.pulse > 0) return;   // All on skips lime and water
      pending[r.ch] = { want: on, until: Date.now() + 3000 };
    });
    renderRelays();
    sendRelay("all", on);
  }

  $("allOn").addEventListener("click", () => allRelays(true));
  $("allOff").addEventListener("click", () => allRelays(false));

  function tick() {
    $("clock").textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  // ---------- exit / shut down popup ----------
  const modal = $("powerModal");
  let backdrop = null;

  function openPower() {
    $("powerChoices").style.display = "block";
    $("powerMsg").style.display = "none";
    $("powerFooter").style.display = "flex";
    $("powerClose").style.display = "block";
    modal.classList.add("show");
    document.body.classList.add("modal-open");
    backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop fade show";
    document.body.appendChild(backdrop);
    $("powerCancel").focus();
  }

  function closePower() {
    modal.classList.remove("show");
    document.body.classList.remove("modal-open");
    if (backdrop) { backdrop.remove(); backdrop = null; }
  }

  function powerMessage(icon, text) {
    $("powerChoices").style.display = "none";
    $("powerFooter").style.display = "none";
    $("powerClose").style.display = "none";
    $("powerMsg").style.display = "block";
    $("powerMsgIcon").className = "fas " + icon + " d-block";
    $("powerMsgText").textContent = text;
  }

  async function powerAction(action) {
    powerMessage("fa-spinner fa-spin", action === "exit" ? "Switching relays off and closing the app" : "Switching relays off and shutting down");
    try {
      const r = await fetch("/api/power", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action })
      });
      const res = await r.json();
      if (!res.ok) {
        powerMessage("fa-exclamation-triangle text-danger", res.error || "Couldn't complete that. Try again.");
        $("powerFooter").style.display = "flex";
        $("powerClose").style.display = "block";
        return;
      }
      if (action === "shutdown") {
        powerMessage("fa-power-off text-danger", "Shutting down. Wait until the green light on the Pi stops blinking before unplugging the power.");
      } else {
        powerMessage("fa-check-circle text-success", "Closing the app");
      }
    } catch (e) {
      powerMessage("fa-exclamation-triangle text-danger", "Panel server not responding. Restart app.py.");
      $("powerFooter").style.display = "flex";
      $("powerClose").style.display = "block";
    }
  }

  $("powerBtn").addEventListener("click", openPower);
  $("powerCancel").addEventListener("click", closePower);
  $("powerClose").addEventListener("click", closePower);
  modal.addEventListener("click", e => { if (e.target === modal) closePower(); });
  $("exitBtn").addEventListener("click", () => powerAction("exit"));
  $("shutdownBtn").addEventListener("click", () => powerAction("shutdown"));

  document.addEventListener("contextmenu", e => e.preventDefault());

  tick(); setInterval(tick, 1000);
  poll(); setInterval(poll, 1000);
</script>
</body>
</html>
